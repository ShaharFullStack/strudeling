<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strudel Builder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="loading-overlay hidden" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading Strudel engine...</div>
</div>

<div class="header">
  <div class="logo">
    <div class="logo-icon">S</div>
    <div class="logo-text">Strudel Builder <span>visual pattern editor</span></div>
  </div>
  <div class="transport">
    <div class="tempo-control">
      <label>BPM</label>
      <input type="number" id="bpm" value="120" min="40" max="300" step="1">
    </div>
    <div class="scale-row" style="margin:0">
      <select class="scale-select" id="globalScale">
        <option value="C:minor">C minor</option>
        <option value="C:major">C major</option>
        <option value="D:minor">D minor</option>
        <option value="D:major">D major</option>
        <option value="E:minor">E minor</option>
        <option value="F:minor">F minor</option>
        <option value="G:minor">G minor</option>
        <option value="A:minor" selected>A minor</option>
        <option value="A:major">A major</option>
        <option value="Bb:minor">Bb minor</option>
        <option value="C:dorian">C dorian</option>
        <option value="D:dorian">D dorian</option>
        <option value="E:phrygian">E phrygian</option>
        <option value="F:lydian">F lydian</option>
        <option value="G:mixolydian">G mixolydian</option>
      </select>
    </div>
    <button class="btn" id="shuffleBtn" title="Randomize">🎲 Shuffle</button>
    <button class="btn btn-play" id="playBtn">▶ Play</button>
  </div>
</div>

<div class="presets-row">
  <div class="preset-chip active" data-preset="empty">Empty</div>
  <div class="preset-chip" data-preset="lofi">Lo-Fi Chill</div>
  <div class="preset-chip" data-preset="techno">Minimal Techno</div>
  <div class="preset-chip" data-preset="ambient">Ambient Drift</div>
  <div class="preset-chip" data-preset="funk">Funky Groove</div>
</div>

<div class="main">
  <div class="tracks-panel" id="tracksPanel">
    <!-- tracks will be injected here -->
    <button class="add-track-btn" id="addTrackBtn">+ Add Track</button>
  </div>

  <div class="code-panel">
    <div class="code-panel-header">
      <div class="code-panel-title">Generated Strudel Code</div>
      <button class="btn" id="copyCode" style="padding:4px 12px;font-size:12px">Copy</button>
    </div>
    <div class="code-output">
      <pre id="codeOutput">// Add tracks and start building!\n// Your Strudel code will appear here.</pre>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@strudel/web@1.0.3"></script>
<script src="js/script.js"></script>

</body>
</html>
